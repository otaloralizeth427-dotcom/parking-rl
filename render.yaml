# Blueprint de Render: servidor de la simulación (plan gratuito, se actualiza con cada push a main).
# Render → New → Blueprint → este repositorio. La web publicada está en https://parking-rl.vercel.app.
services:
  - type: web
    name: parking-rl-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Solo se reconstruye si cambia algo que el servidor usa (no la web ni la documentación)
    buildFilter:
      paths: [api/**, agents/**, envs/**, pipelines/**, configs/**, manifests/**, serving/**, artifacts/**, results/**, deploy/Dockerfile, deploy/requirements-serve.txt, render.yaml]
    healthCheckPath: /api/health
    envVars:
      - key: PARKING_PUBLIC
        value: "1"
      - key: PARKING_LEVEL
        value: N5
      - key: PARKING_ALLOWED_ORIGINS
        value: https://parking-rl.vercel.app
      # Vistas previas de Vercel del mismo proyecto (equipo visua4)
      - key: PARKING_ALLOWED_ORIGIN_REGEX
        value: ^https://parking-(rl|[a-z0-9]+-visua4)[a-z0-9-]*\.vercel\.app$

  # Registro de experimentos (MLflow) de solo consulta: copia versionada en registry/ + artifacts/
  - type: web
    name: parking-rl-mlflow
    runtime: docker
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    dockerfilePath: ./deploy/mlflow.Dockerfile
    dockerContext: .
    buildFilter:
      paths: [registry/**, artifacts/**, deploy/mlflow.Dockerfile, deploy/build_registry.py, render.yaml]
    healthCheckPath: /health
