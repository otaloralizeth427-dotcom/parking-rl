# Mantiene despiertos los servicios gratuitos de Render en el horario de revisión y presentación.
# Render duerme un servicio tras 15 min sin visitas; esto lo visita cada 10 min entre
# 12:30 y 15:50 (hora de Colombia, UTC-5). También se puede lanzar a mano (Run workflow).
name: Despertador (Render)

on:
  schedule:
    - cron: "30-59/10 17 * * *"
    - cron: "*/10 18-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar API y MLflow
        run: |
          for url in https://parking-rl-api.onrender.com/api/health https://parking-rl-mlflow.onrender.com/health; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" "$url") && [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$url → $code"
          done
